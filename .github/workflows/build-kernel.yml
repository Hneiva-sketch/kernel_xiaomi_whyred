name: Build Kernel whyred (BT HCIUART + RFCOMM, DTB fstab)

# Reproduce el flujo OFICIAL del repo (build.sh):
#   make vendor/whyred_defconfig
#   disable CONFIG_NEWCAM_BLOBS
#   disable CONFIG_DYNAMIC_WHYRED   <-- CLAVE: asi el Makefile de dts genera
#                                       whyred_fstab.dtb (con nodo firmware/android/fstab)
#                                       en vez de whyred.dtb (sin el).
#   + BT_HCIUART / BT_HCIUART_H4 / BT_HCIUART_QCA / BT_RFCOMM / BT_RFCOMM_TTY  (lo nuestro)
#   - CONFIG_KSU (usamos Magisk)
#   make dtbs ; make Image
#   Image.gz-dtb = gzip(Image) + whyred_fstab.dtb          (igual que el kernel del ROM)
#
# Toolchain: clang-14/lld-14/llvm-14 de Ubuntu 22.04 (paquetes firmados por Canonical).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: lto-on
            lto: keep
          - variant: lto-off
            lto: disable

    steps:
      - name: Checkout fuente + submodulo KernelSU (necesario para drivers/Kconfig)
        uses: actions/checkout@v4
        with:
          ref: fourteen
          fetch-depth: 1
          submodules: recursive

      - name: Identificar la fuente exacta
        run: |
          echo "HEAD=$(git rev-parse HEAD)"
          git log -1 --oneline
          echo "defconfig_lines=$(wc -l < arch/arm64/configs/vendor/whyred_defconfig)"
          ls -l drivers/kernelsu || true
          test -f drivers/kernelsu/Kconfig && echo "OK drivers/kernelsu/Kconfig presente" || { echo "FALTA drivers/kernelsu/Kconfig"; exit 1; }
          echo "--- lineas relevantes del Makefile de dts ---"
          grep -nE 'whyred|DYNAMIC_WHYRED' arch/arm64/boot/dts/vendor/qcom/Makefile || true

      - name: Instalar dependencias (clang-14 oficial de Ubuntu)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential bc bison flex cpio rsync \
            libssl-dev libelf-dev libncurses-dev \
            zip unzip curl wget git perl python3 \
            device-tree-compiler lzop xz-utils zstd \
            clang-14 lld-14 llvm-14 \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi

      - name: Crear carpeta de toolchain sin sufijo de version
        run: |
          set -e
          mkdir -p "$HOME/tc/bin"
          for t in clang clang++ ld.lld lld llvm-ar llvm-nm llvm-objcopy \
                   llvm-objdump llvm-readelf llvm-ranlib llvm-strip \
                   llvm-size llvm-strings llvm-as llvm-dis llvm-link opt llc; do
            p="$(command -v "${t}-14" 2>/dev/null || true)"
            if [ -n "$p" ]; then ln -sf "$p" "$HOME/tc/bin/$t"; fi
          done
          echo "$HOME/tc/bin" >> "$GITHUB_PATH"

      - name: Versiones del toolchain
        run: |
          clang --version
          ld.lld --version
          dtc --version

      - name: Configurar defconfig (flujo oficial + Bluetooth)
        run: |
          set -e
          export ARCH=arm64

          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 vendor/whyred_defconfig

          CFG=./scripts/config
          # --- flujo oficial de build.sh ---
          $CFG --file out/.config -d NEWCAM_BLOBS || true
          echo "### DESACTIVANDO CONFIG_DYNAMIC_WHYRED (queremos whyred_fstab.dtb)"
          $CFG --file out/.config -d DYNAMIC_WHYRED

          # --- lo que necesitamos anadir (Bluetooth sobre UART) ---
          $CFG --file out/.config -e BT_HCIUART
          $CFG --file out/.config -e BT_HCIUART_H4
          $CFG --file out/.config -e BT_HCIUART_QCA
          $CFG --file out/.config -e BT_RFCOMM
          $CFG --file out/.config -e BT_RFCOMM_TTY

          # --- KernelSU fuera: usamos Magisk ---
          $CFG --file out/.config -d KSU

          # --- variante del matrix ---
          if [ "${{ matrix.lto }}" = "disable" ]; then
            echo "### desactivando CONFIG_LTO_CLANG"
            $CFG --file out/.config -d LTO_CLANG
          fi

          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig

          echo "===================== VERIFICACION (obligatorios) ====================="
          for opt in BT BT_BREDR BT_HCIUART BT_HCIUART_H4 BT_HCIUART_QCA \
                     BT_RFCOMM BT_RFCOMM_TTY USB_CONFIGFS_F_ACC USB_CONFIGFS_UEVENT \
                     ARCH_SDM660; do
            if grep -qE "^CONFIG_${opt}=y$" out/.config; then
              echo "OK    CONFIG_${opt}=y"
            else
              echo "FALTA CONFIG_${opt}=y"
              grep -E "CONFIG_${opt}" out/.config || true
              exit 1
            fi
          done

          echo "===================== DTB: tiene que ser la variante fstab ====================="
          if grep -qE "^# CONFIG_DYNAMIC_WHYRED is not set$" out/.config; then
            echo "OK    CONFIG_DYNAMIC_WHYRED desactivado -> el Makefile dara whyred_fstab.dtb"
          else
            echo "ERROR: CONFIG_DYNAMIC_WHYRED no esta desactivado:"
            grep -E "DYNAMIC_WHYRED" out/.config || true
            exit 1
          fi

          echo "===================== flags relevantes ====================="
          grep -E "^(CONFIG_KSU|# CONFIG_KSU|CONFIG_CC_WERROR|# CONFIG_CC_WERROR|CONFIG_LTO_CLANG|# CONFIG_LTO_CLANG|CONFIG_LOCALVERSION=|CONFIG_MODULE_SIG|CONFIG_MODULE_SIG_FORCE|CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE|# CONFIG_DYNAMIC_WHYRED)" out/.config || true
          echo "==========================================================="

      - name: PARCHE DTSI - forzar dr_mode = peripheral en dwc3 (whyred)
        run: |
          set -e
          F=arch/arm64/boot/dts/vendor/qcom/whyred/whyred.dtsi
          test -f "$F" || { echo "ERROR: no existe $F"; exit 1; }

          echo "===================== ANTES ====================="
          sed -n '/^&usb3 {/,/^};/p' "$F"

          # El bloque de whyred.dtsi es:
          #   &usb3 {
          #       extcon = <&pm660_charger>;
          #       vbus_dwc3-supply = <&smb2_vbus>;
          #
          #       dwc3@a800000 {
          #           usb-phy = <&qusb_phy0>, <&usb_nop_phy>;
          #           maximum-speed = "high-speed";
          #       };
          #
          # Insertamos dr_mode = "peripheral"; dentro de dwc3@a800000 para
          # sobrescribir el dr_mode = "otg" heredado de sdm660-common.dtsi.
          # Comprobacion previa: no debe existir ya un dr_mode en el override.
          if sed -n '/^&usb3 {/,/^};/p' "$F" | grep -q 'dr_mode'; then
            echo "AVISO: ya habia dr_mode en el override; se reemplaza"
            sed -i '/^&usb3 {/,/^};/ s/dr_mode = "[a-z]*";/dr_mode = "peripheral";/' "$F"
          else
            # Anade dr_mode justo despues de la linea maximum-speed del dwc3@a800000
            awk '
              /^&usb3 \{/ { in_usb3=1 }
              in_usb3 && /maximum-speed = "high-speed";/ && !done {
                print;
                print "\t\tdr_mode = \"peripheral\";";
                done=1;
                next
              }
              in_usb3 && /^\};/ { in_usb3=0 }
              { print }
            ' "$F" > "$F.new"
            mv "$F.new" "$F"
          fi

          echo "===================== DESPUES ====================="
          sed -n '/^&usb3 {/,/^};/p' "$F"

          sed -n '/^&usb3 {/,/^};/p' "$F" | grep -q 'dr_mode = "peripheral";' \
            || { echo "ERROR: el parche no se aplico"; exit 1; }
          echo "OK: dr_mode = peripheral aplicado en $F"

      - name: Compilar Image y dtbs
        run: |
          set -e
          export ARCH=arm64

          mkbuild() {
            make -j"$(nproc)" O=out ARCH=arm64 \
              CROSS_COMPILE=aarch64-linux-gnu- \
              CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
              LLVM=1 LLVM_IAS=1 "$@"
          }

          echo "########## dtbs ##########"
          mkbuild dtbs
          echo "########## Image ##########"
          mkbuild Image

          echo "---- out/arch/arm64/boot ----"
          ls -l out/arch/arm64/boot/
          echo "---- dtbs generados ----"
          ls -l out/arch/arm64/boot/dts/vendor/qcom/whyred* || true

      - name: Montar Image.gz-dtb (gzip(Image) + whyred_fstab.dtb) y VERIFICAR
        run: |
          set -e
          DTB=out/arch/arm64/boot/dts/vendor/qcom/whyred_fstab.dtb
          test -s "$DTB" || { echo "ERROR: no existe $DTB"; ls -l out/arch/arm64/boot/dts/vendor/qcom/ | head -50; exit 1; }
          test -s out/arch/arm64/boot/Image

          echo "=== el DTB DEBE llevar el nodo firmware/android/fstab ==="
          dtc -I dtb -O dts -o /tmp/fstab.dts "$DTB"
          grep -n -A3 'firmware/android/fstab' /tmp/fstab.dts | head -40 || { echo "ERROR: el DTB no tiene nodo fstab"; exit 1; }
          grep -q 'by-name/system' /tmp/fstab.dts || { echo "ERROR: el DTB no referencia by-name/system"; exit 1; }
          grep -q 'by-name/vendor' /tmp/fstab.dts || { echo "ERROR: el DTB no referencia by-name/vendor"; exit 1; }

          echo "=== CLAVE: el DTB DEBE tener dr_mode = peripheral en ssusb@a800000 ==="
          # Extrae el nodo ssusb@a800000 -> dwc3@a800000 y comprueba dr_mode
          awk '/ssusb@a800000/{f=1} f{print} f&&/^\t};/{exit}' /tmp/fstab.dts > /tmp/usbnode.dts
          echo "---- nodo ssusb@a800000 (recortado) ----"
          head -60 /tmp/usbnode.dts
          echo "---- dr_mode dentro de dwc3 ----"
          awk '/dwc3@a800000/{g=1} g{print} g&&/^\t\t};/{exit}' /tmp/fstab.dts | grep -n 'dr_mode' || true
          if awk '/dwc3@a800000/{g=1} g{print} g&&/^\t\t};/{exit}' /tmp/fstab.dts | grep -q 'dr_mode = "peripheral"'; then
            echo "OK: dr_mode = peripheral presente en dwc3@a800000"
          else
            echo "ERROR: dr_mode = peripheral NO esta en el dwc3@a800000 del DTB"
            exit 1
          fi
          # Y no debe quedar ningun dr_mode = "otg" en el nodo de usb3
          if awk '/ssusb@a800000/{f=1} f{print} f&&/^\t};/{exit}' /tmp/fstab.dts | grep -q 'dr_mode = "otg"'; then
            echo "ERROR: sigue habiendo dr_mode = otg en ssusb@a800000"
            exit 1
          fi
          echo "OK: no queda dr_mode = otg en el nodo usb3"

          echo "=== raiz (msm-id / board-id) ==="
          grep -nE 'qcom,msm-id|qcom,board-id|compatible' /tmp/fstab.dts | head -8

          echo "=== montando Image.gz-dtb ==="
          gzip -9 -c out/arch/arm64/boot/Image > out/Image.gz
          gzip -t out/Image.gz && echo "OK gzip valido"
          cat out/Image.gz "$DTB" > out/Image.gz-dtb

          SIZE=$(stat -c%s "$DTB")
          echo "tamano DTB = $SIZE"
          tail -c "$SIZE" out/Image.gz-dtb | cmp - "$DTB" && echo "OK: el DTB esta correctamente anexado al final"
          python3 - <<'PY'
          import struct, zlib
          data = open('out/Image.gz-dtb','rb').read()
          print("Image.gz-dtb:", len(data), "bytes")
          assert data[:2] == b'\x1f\x8b', "no empieza por gzip"
          d = zlib.decompressobj(31)
          img = d.decompress(data) + d.flush()
          rest = d.unused_data
          print("  Image descomprimido:", len(img), "bytes")
          print("  resto tras el gzip :", len(rest), "bytes, magic", rest[:4].hex())
          assert rest[:4] == b'\xd0\x0d\xfe\xed', "el resto no es un DTB"
          totalsize = struct.unpack('>I', rest[4:8])[0]
          print("  totalsize del DTB  :", totalsize)
          assert totalsize == len(rest), "el DTB no ocupa todo el resto"
          print("  OK estructura Image.gz + dtb")
          PY

          sha256sum out/Image.gz-dtb out/Image "$DTB" out/.config | tee sha256.txt
          cp out/.config config-real.config
          cp out/System.map System.map.txt || true

      - name: Subir artefactos
        uses: actions/upload-artifact@v4
        with:
          name: kernel-whyred-${{ matrix.variant }}
          path: |
            out/Image.gz-dtb
            Image.gz
            sha256.txt
            config-real.config
            System.map.txt
          if-no-files-found: error
          retention-days: 30
