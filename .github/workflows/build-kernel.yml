name: Build Kernel (whyred)

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: "Defconfig to use"
        required: true
        default: "whyred_defconfig"
      kernel_name:
        description: "Kernel name suffix"
        required: true
        default: "HCIUART"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: fourteen
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            zip \
            unzip \
            curl \
            wget \
            git \
            python3 \
            python3-pip \
            device-tree-compiler \
            lzop \
            xz-utils \
            zstd

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-whyred-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-whyred-

      - name: Enable ccache
        run: |
          echo "CCACHE_DIR=~/.ccache" >> $GITHUB_ENV
          echo "CCACHE_EXEC=$(which ccache)" >> $GITHUB_ENV
          echo "CCACHE_COMPRESS=1" >> $GITHUB_ENV
          echo "CCACHE_COMPRESSLEVEL=6" >> $GITHUB_ENV
          echo "CCACHE_MAXSIZE=2G" >> $GITHUB_ENV
          ccache -M 2G
          ccache -z

      - name: Get kernel version info
        id: kernel_info
        run: |
          KERNEL_VERSION=$(make -s kernelversion 2>/dev/null || echo "4.19")
          echo "KERNEL_VERSION=$KERNEL_VERSION" >> $GITHUB_OUTPUT
          echo "Kernel version: $KERNEL_VERSION"

      - name: Enable Bluetooth HCIUART + RFCOMM (required for aa-proxy)
        run: |
          DEFCONFIG_FILE="arch/arm64/configs/${{ github.event.inputs.defconfig }}"
          echo "Patching $DEFCONFIG_FILE to enable HCIUART + RFCOMM..."

          # HCI over UART (QCA WCN3990)
          sed -i 's/^# CONFIG_BT_HCIUART is not set/CONFIG_BT_HCIUART=y/' "$DEFCONFIG_FILE" || echo "CONFIG_BT_HCIUART=y" >> "$DEFCONFIG_FILE"
          grep -q "CONFIG_BT_HCIUART_H4" "$DEFCONFIG_FILE" && sed -i 's/^# CONFIG_BT_HCIUART_H4 is not set/CONFIG_BT_HCIUART_H4=y/' "$DEFCONFIG_FILE" || echo "CONFIG_BT_HCIUART_H4=y" >> "$DEFCONFIG_FILE"
          grep -q "CONFIG_BT_HCIUART_QCA" "$DEFCONFIG_FILE" && sed -i 's/^# CONFIG_BT_HCIUART_QCA is not set/CONFIG_BT_HCIUART_QCA=y/' "$DEFCONFIG_FILE" || echo "CONFIG_BT_HCIUART_QCA=y" >> "$DEFCONFIG_FILE"

          # RFCOMM (needed for Bluetooth profiles)
          grep -q "CONFIG_BT_RFCOMM" "$DEFCONFIG_FILE" && sed -i 's/^# CONFIG_BT_RFCOMM is not set/CONFIG_BT_RFCOMM=y/' "$DEFCONFIG_FILE" || echo "CONFIG_BT_RFCOMM=y" >> "$DEFCONFIG_FILE"
          grep -q "CONFIG_BT_RFCOMM_TTY" "$DEFCONFIG_FILE" && sed -i 's/^# CONFIG_BT_RFCOMM_TTY is not set/CONFIG_BT_RFCOMM_TTY=y/' "$DEFCONFIG_FILE" || echo "CONFIG_BT_RFCOMM_TTY=y" >> "$DEFCONFIG_FILE"

          # HCIVHCI (optional, useful for debugging - no harm)
          grep -q "CONFIG_BT_HCIVHCI" "$DEFCONFIG_FILE" && sed -i 's/^# CONFIG_BT_HCIVHCI is not set/CONFIG_BT_HCIVHCI=y/' "$DEFCONFIG_FILE" || true

          echo "=== Verifying BT config ==="
          grep -E "CONFIG_BT_HCIUART|CONFIG_BT_RFCOMM" "$DEFCONFIG_FILE"

      - name: Build kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$HOME/.local/bin:$PATH"

          # Use Clang from Android prebuilt if available, fallback to system clang
          if [ -d "prebuilts/clang/host/linux-x86" ]; then
            CLANG_PATH=$(find prebuilts/clang/host/linux-x86 -name "clang" -type f | head -1 | xargs dirname)
            export PATH="$CLANG_PATH:$PATH"
            export CC=clang
            export CROSS_COMPILE=aarch64-linux-android-
            export CROSS_COMPILE_ARM32=arm-linux-androideabi-
            export LD=ld.lld
            export AR=llvm-ar
            export NM=llvm-nm
            export OBJCOPY=llvm-objcopy
            export OBJDUMP=llvm-objdump
            export STRIP=llvm-strip
            export READELF=llvm-readelf
          else
            export CC=clang
            export CROSS_COMPILE=aarch64-linux-gnu-
            export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          fi

          echo "Compiler: $(which $CC)"
          $CC --version | head -1

          make O=out ${{ github.event.inputs.defconfig }}
          make O=out -j$(nproc) CCACHE=${CCACHE_EXEC} Image.gz-dtb

      - name: Download AnyKernel3
        run: |
          git clone --depth 1 https://github.com/AnyKernel3/AnyKernel3.git AnyKernel3

      - name: Package kernel with AnyKernel3 (flashable ZIP)
        run: |
          KERNEL_IMAGE="out/arch/arm64/boot/Image.gz-dtb"
          ANYKERNEL_DIR="AnyKernel3"
          ZIP_NAME="Kernel-whyred-4.19-${{ github.event.inputs.kernel_name }}-$(date +%Y%m%d-%H%M%S).zip"

          if [ ! -f "$KERNEL_IMAGE" ]; then
            echo "Kernel image not found: $KERNEL_IMAGE"
            find out -name "Image*" 2>&1 | head -10
            exit 1
          fi

          cp "$KERNEL_IMAGE" "$ANYKERNEL_DIR/Image.gz-dtb"

          cd "$ANYKERNEL_DIR"
          zip -r9 "../$ZIP_NAME" *
          cd ..

          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
          echo "Created: $ZIP_NAME"

      - name: Upload flashable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}
          retention-days: 30

      - name: Upload raw Image.gz-dtb (for manual repack)
        uses: actions/upload-artifact@v4
        with:
          name: Image.gz-dtb-${{ github.run_id }}
          path: out/arch/arm64/boot/Image.gz-dtb
          retention-days: 30

      - name: Ccache stats
        run: ccache -s
