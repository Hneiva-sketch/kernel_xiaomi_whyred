name: Build Kernel whyred (HCIUART + RFCOMM)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout kernel source (branch fourteen)
        uses: actions/checkout@v4
        with:
          ref: fourteen
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential bc bison flex cpio rsync \
            libssl-dev libelf-dev libncurses-dev \
            zip unzip curl wget git perl python3 \
            device-tree-compiler lzop xz-utils zstd

      - name: Fetch Clang toolchain
        run: |
          git clone --depth 1 -b master \
            https://gitlab.com/shekhawat2/clang-builds.git \
            "$GITHUB_WORKSPACE/../clang-builds"
          "$GITHUB_WORKSPACE/../clang-builds/bin/clang" --version | head -n1

      - name: Configure defconfig + enable Bluetooth HCIUART/RFCOMM
        run: |
          export ARCH=arm64
          export PATH="$GITHUB_WORKSPACE/../clang-builds/bin:$PATH"

          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 vendor/whyred_defconfig

          CFG=./scripts/config
          $CFG --file out/.config -e BT_HCIUART
          $CFG --file out/.config -e BT_HCIUART_H4
          $CFG --file out/.config -e BT_HCIUART_QCA
          $CFG --file out/.config -e BT_RFCOMM
          $CFG --file out/.config -e BT_RFCOMM_TTY

          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig

          echo "===================== VERIFICACION ====================="
          for opt in BT BT_BREDR BT_HCIUART BT_HCIUART_SERDEV BT_HCIUART_H4 BT_HCIUART_QCA BT_RFCOMM BT_RFCOMM_TTY; do
            if grep -qE "^CONFIG_${opt}=y$" out/.config; then
              echo "OK   CONFIG_${opt}=y"
            else
              echo "FALTA: CONFIG_${opt}=y"
              exit 1
            fi
          done
          echo "========================================================"

      - name: Build Image.gz-dtb
        run: |
          export ARCH=arm64
          export PATH="$GITHUB_WORKSPACE/../clang-builds/bin:$PATH"
          time make O=out ARCH=arm64 -j"$(nproc)" \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1 LLVM_IAS=1 \
            Image.gz-dtb
          echo "---- out/arch/arm64/boot ----"
          ls -l out/arch/arm64/boot/

      - name: Verify image and hash
        run: |
          test -s out/arch/arm64/boot/Image.gz-dtb
          sha256sum out/arch/arm64/boot/Image.gz-dtb | tee sha256.txt

      - name: Upload Image.gz-dtb
        uses: actions/upload-artifact@v4
        with:
          name: Image.gz-dtb-whyred-hciuart
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            sha256.txt
          if-no-files-found: error
          retention-days: 30
